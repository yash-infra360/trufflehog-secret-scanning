name: "Secret Detection & Protection Gate"

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  scan-secrets:
    name: "Scan Active Secrets"
    uses: ./.github/workflows/secret-scan-reusable.yml
    with:
      only-verified: true # Checks for verified/active live credentials only
