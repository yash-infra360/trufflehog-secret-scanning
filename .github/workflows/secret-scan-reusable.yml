name: "Reusable TruffleHog Secret Scanner"

# Centralized Reusable Workflow in shipsy/devops
# Enforces Active Verified Secrets Check & History Verification Across All Commits

on:
  workflow_call:
    inputs:
      only-verified:
        description: "Checks if detected secrets are live/active via real-time API verification."
        required: false
        default: true
        type: boolean

jobs:
  trufflehog-scan:
    name: TruffleHog Active Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Complete PR History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full git history so TruffleHog checks EVERY commit in this PR branch

      - name: Run TruffleHog Live Secret Verification
        id: trufflehog
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch || 'main' }}
          head: ${{ github.event.pull_request.head.sha || 'HEAD' }}
          extra_args: --only-verified --no-verification-cache --json

      # Post clear alert on PR if an ACTIVE un-rotated secret is found in any commit
      - name: Post PR Security Alert
        if: steps.trufflehog.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `### 🚨 Security Gate Failed: Active Secret Detected!
            
            TruffleHog tested the credentials in this PR against live cloud APIs and confirmed that **an active, live secret is present in this branch's commit history**.
            
            ⛔ **Merging is BLOCKED** until the following actions are completed:
            
            1. **Rotate/Revoke the Key**: Deactivate/delete the leaked credential in your provider console (AWS, GitHub, Slack, etc.).
            2. **Update Code**: Remove the hardcoded secret and use environment variables.
            3. **Push New Commit**: Once the key is revoked on the provider, push a new commit. TruffleHog will verify the key is dead and automatically unlock the merge.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Enforce Branch Protection Block
        if: steps.trufflehog.outcome == 'failure'
        run: |
          echo "❌ Merge Blocked: Live active secret found in branch commits."
          exit 1
