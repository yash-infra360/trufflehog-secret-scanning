name: "Reusable TruffleHog Secret Scanner"

# Centralized Reusable Workflow in shipsy/devops
# Automatically posts clear PR Comments & Annotations when secrets are found

on:
  workflow_call:
    inputs:
      only-verified:
        description: "Set to true to fail ONLY on live/active verified secrets."
        required: false
        default: false
        type: boolean

jobs:
  trufflehog-scan:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Allows posting clear comment directly on the PR
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog Scanner
        id: trufflehog
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true # Let next step post the clean PR comment
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch || 'main' }}
          head: ${{ github.event.pull_request.head.sha || 'HEAD' }}
          extra_args: --json ${{ inputs.only-verified && '--only-verified' || '' }}

      # Post crystal-clear comment directly on the Pull Request Conversation tab
      - name: Post Clear PR Alert
        if: steps.trufflehog.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `### 🚨 Security Gate Failed: Hardcoded Secret Detected!
            
            TruffleHog detected hardcoded secrets in the commits on this branch.
            
            ⛔ **Merging is physically blocked** until this is resolved.
            
            ---
            
            ### 🔍 What you need to do:
            1. **Rotate/Revoke**: Delete or rotate the leaked credential immediately in your provider dashboard (AWS/GitHub/etc.).
            2. **Fix Code**: Open the file where the secret was added, remove the secret string, and use environment variables.
            3. **Push Fix**: Push the clean commit to this branch. The merge button will automatically unlock.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Enforce PR Block
        if: steps.trufflehog.outcome == 'failure'
        run: |
          echo "❌ Merge Blocked: Hardcoded secrets detected in PR diff."
          exit 1
